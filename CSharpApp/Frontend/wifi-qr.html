  <meta charset="UTF-8">

</head>
<body>
  <div class="background">
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="scanline"></div>
  </div>

  <div class="wifi-container">
    <h1 class="wifi-title" data-i18n="wifi_title">Générateur QR Code WiFi</h1>

    <div id="status" class="status loading">
      <div class="spinner"></div>
      <span data-i18n="wifi_detecting">Détection du WiFi en cours...</span>
    </div>

    <div id="wifi-info" class="wifi-info">
      <h3 data-i18n="wifi_available_networks">Réseaux WiFi disponibles</h3>

      <div class="password-container">
        <label for="network-select" data-i18n="wifi_select_network">Sélectionner un réseau</label>
        <select id="network-select" class="wifi-input">
          <option value="" data-i18n="wifi_choose_network">-- Choisir un réseau --</option>
        </select>
      </div>

      <div id="network-details" style="display: none; margin-top: 20px;">
        <div class="info-row">
          <span class="info-label" data-i18n="wifi_ssid">Nom du réseau (SSID)</span>
          <span class="info-value" id="ssid-display">-</span>
        </div>
        <div class="info-row">
          <span class="info-label" data-i18n="wifi_security">Sécurité</span>
          <span class="info-value" id="security-display">-</span>
        </div>

        <div class="password-container" id="password-section">
          <label for="password" data-i18n="wifi_password">Mot de passe WiFi</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" class="wifi-input" placeholder="Entrez le mot de passe" data-i18n-placeholder="wifi_password_placeholder">
          </div>
        </div>
      </div>
    </div>

    <div class="btn-group">
      <button onclick="window.location.href='index.html'" class="wifi-btn btn-back" data-i18n="wifi_back">Retour</button>
      <button id="refreshBtn" class="wifi-btn btn-secondary" data-i18n="wifi_refresh">Actualiser</button>
      <button id="generateBtn" class="wifi-btn btn-primary" disabled data-i18n="wifi_generate">Générer QR Code</button>
    </div>

    <div id="qr-container">
      <h3 data-i18n="wifi_scan_qr">Scannez ce QR Code</h3>
      <img id="qr-image" alt="WiFi QR Code">
    </div>
  </div>  <script>
    let currentWiFi = null;
    let wifiProfiles = [];

    // Helper for translations
    function getT(key) {
      const lang = localStorage.getItem("preferredLang") || "fr";
      return (window.translations && window.translations[lang] && window.translations[lang][key]) || key;
    }

    // Get the correct reference to the COM object
    const electronAPI = chrome?.webview?.hostObjects?.sync?.electronAPI;

    const statusDiv = document.getElementById('status');
    const wifiInfoDiv = document.getElementById('wifi-info');
    const qrContainer = document.getElementById('qr-container');
    const generateBtn = document.getElementById('generateBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const passwordInput = document.getElementById('password');
    const passwordSection = document.getElementById('password-section');
    const networkSelect = document.getElementById('network-select');
    const networkDetails = document.getElementById('network-details');

    // Fonction pour afficher les infos WiFi
    function displayWiFiInfo(wifiInfo) {
      if (!wifiInfo.success) {
        statusDiv.className = 'status error';
        statusDiv.innerHTML = `❌ ${getT('wifi_error')} ${wifiInfo.error}`;
        wifiInfoDiv.classList.remove('visible');
        generateBtn.disabled = true;
        return;
      }

      // Si on a plusieurs profils (liste)
      if (wifiInfo.profiles && Array.isArray(wifiInfo.profiles)) {
        wifiProfiles = wifiInfo.profiles;

        // Remplir le select
        networkSelect.innerHTML = `<option value="">${getT('wifi_choose_network')}</option>`;
        wifiProfiles.forEach((profile, index) => {
          const option = document.createElement('option');
          option.value = index;
          option.textContent = profile.ssid;
          networkSelect.appendChild(option);
        });

        statusDiv.className = 'status success';
        statusDiv.textContent = `✅ ${wifiProfiles.length} ${getT('wifi_networks_found')}`;
        wifiInfoDiv.classList.add('visible');
        networkDetails.style.display = 'none';
        generateBtn.disabled = true;
        return;
      }

      // Si on a un seul réseau (connecté)
      currentWiFi = wifiInfo;

      // Afficher les infos
      document.getElementById('ssid-display').textContent = wifiInfo.ssid;
      document.getElementById('security-display').textContent = wifiInfo.security || 'WPA';

      // Gérer le mot de passe
      if (wifiInfo.password) {
        statusDiv.className = 'status success';
        statusDiv.textContent = `✅ ${getT('wifi_detected_auto_password')}`;
        passwordInput.value = wifiInfo.password;
        passwordSection.style.display = 'none';
      } else {
        statusDiv.className = 'status success';
        statusDiv.innerHTML = `✅ ${getT('wifi_detected')} <br><small>${getT('wifi_enter_password_manual')}</small>`;
        passwordInput.value = '';
        passwordSection.style.display = 'block';
      }

      wifiInfoDiv.classList.add('visible');
      networkDetails.style.display = 'block';
      generateBtn.disabled = false;
    }

    // Gérer la sélection d'un réseau
    networkSelect.addEventListener('change', () => {
      const selectedIndex = networkSelect.value;

      if (selectedIndex === '') {
        networkDetails.style.display = 'none';
        generateBtn.disabled = true;
        currentWiFi = null;
        return;
      }

      const profile = wifiProfiles[parseInt(selectedIndex)];
      currentWiFi = profile;

      // Afficher les détails
      document.getElementById('ssid-display').textContent = profile.ssid;
      document.getElementById('security-display').textContent = profile.security || 'WPA';

      // Gérer le mot de passe
      if (profile.password) {
        passwordInput.value = profile.password;
        passwordSection.style.display = 'none';
        generateBtn.disabled = false;
      } else {
        passwordInput.value = '';
        passwordSection.style.display = 'block';
        generateBtn.disabled = true;
      }

      networkDetails.style.display = 'block';
    });

    // Initialiser la détection WiFi au chargement de la page
    window.addEventListener('DOMContentLoaded', () => {
      // Notifier Python que l'utilisateur entre dans la page WiFi QR
      try {
        if (electronAPI) {
          electronAPI.StartWifiQrMode();
          console.log('[WiFi QR] Mode started - notified Python');
        }
      } catch (error) {
        console.error('[WiFi QR] Error starting WiFi QR mode:', error);
      }

      // Use setTimeout to let the UI refresh (show spinner) before blocking COM call
      setTimeout(() => {
        try {
          console.log('=== WiFi Detection Start ===');
          console.log('electronAPI:', electronAPI);

          if (!electronAPI) {
            throw new Error('electronAPI non disponible - Utilisez chrome.webview.hostObjects.sync.electronAPI');
          }

          console.log('Calling RefreshWiFi...');
          const wifiInfoJson = electronAPI.RefreshWiFi();
          console.log('Raw JSON:', wifiInfoJson);

          const wifiInfo = JSON.parse(wifiInfoJson);
          console.log('Parsed data:', wifiInfo);

          displayWiFiInfo(wifiInfo);
        } catch (error) {
          console.error('=== ERROR ===', error);
          statusDiv.className = 'status error';
          statusDiv.innerHTML = `❌ ${getT('wifi_error')} ${error.message}<br><small>Vérifiez la console (F12)</small>`;
        }
      }, 100); // Small delay to let UI refresh
    });

    // Notifier Python quand l'utilisateur quitte la page
    window.addEventListener('beforeunload', () => {
      try {
        if (electronAPI) {
          electronAPI.StopWifiQrMode();
          console.log('[WiFi QR] Mode stopped - notified Python');
        }
      } catch (error) {
        console.error('[WiFi QR] Error stopping WiFi QR mode:', error);
      }
    });

    // Également intercepter le clic sur le bouton retour
    document.querySelector('.btn-back').addEventListener('click', (e) => {
      try {
        if (electronAPI) {
          electronAPI.StopWifiQrMode();
          console.log('[WiFi QR] Mode stopped via back button - notified Python');
        }
      } catch (error) {
        console.error('[WiFi QR] Error stopping WiFi QR mode:', error);
      }
      // La navigation se fait normalement via l'onclick du bouton
    });

    // Bouton actualiser
    refreshBtn.addEventListener('click', () => {
      // Show loading state immediately
      console.log('=== Refresh WiFi ===');
      statusDiv.className = 'status loading';
      statusDiv.innerHTML = `<div class="spinner"></div>${getT('wifi_refreshing')}`;
      generateBtn.disabled = true;
      qrContainer.classList.remove('visible');

      // Use setTimeout to let the UI refresh (show spinner) before blocking COM call
      setTimeout(() => {
        try {
          const wifiInfoJson = electronAPI.RefreshWiFi();
          console.log('Refresh - Raw JSON:', wifiInfoJson);

          const wifiInfo = JSON.parse(wifiInfoJson);
          console.log('Refresh - Parsed data:', wifiInfo);

          displayWiFiInfo(wifiInfo);
        } catch (error) {
          console.error('=== REFRESH ERROR ===', error);
          statusDiv.className = 'status error';
          statusDiv.innerHTML = `❌ ${getT('wifi_error')} ${error.message}`;
        }
      }, 100); // Small delay to let UI refresh
    });

    // Bouton générer QR Code
    generateBtn.addEventListener('click', () => {
      if (!currentWiFi) return;

      const password = passwordInput.value;

      if (!password) {
        statusDiv.className = 'status error';
        statusDiv.textContent = `⚠️ ${getT('wifi_enter_password_error')}`;
        return;
      }

      try {
        generateBtn.disabled = true;
        generateBtn.textContent = `⏳ ${getT('wifi_generating')}`;

        console.log('=== Generate QR Code ===');
        console.log('SSID:', currentWiFi.ssid);
        console.log('Security:', currentWiFi.security);

        const qrCodeDataUrl = electronAPI.GenerateWiFiQR(
          currentWiFi.ssid,
          password,
          currentWiFi.security || 'WPA'
        );

        console.log('QR Code Result:', qrCodeDataUrl?.substring(0, 50) + '...');

        if (qrCodeDataUrl && qrCodeDataUrl.startsWith('data:image')) {
          document.getElementById('qr-image').src = qrCodeDataUrl;
          qrContainer.classList.add('visible');
          statusDiv.className = 'status success';
          statusDiv.textContent = `✅ ${getT('wifi_qr_generated_success')}`;
        } else {
          statusDiv.className = 'status error';
          statusDiv.textContent = `❌ ${getT('wifi_qr_generated_error')}`;
        }
      } catch (error) {
        console.error('=== QR ERROR ===', error);
        statusDiv.className = 'status error';
        statusDiv.textContent = `❌ ${getT('wifi_error')} ${error.message}`;
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = getT('wifi_generate');
      }
    });

    // Activer le bouton si on tape un mot de passe
    passwordInput.addEventListener('input', () => {
      if (currentWiFi && passwordInput.value) {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
