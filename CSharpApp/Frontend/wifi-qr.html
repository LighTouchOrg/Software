<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WiFi QR Code Generator - LighTouch</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .wifi-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
      margin: 20px auto;
      backdrop-filter: blur(10px);
    }
    
    .wifi-title {
      color: #333;
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
      font-weight: bold;
    }
    
    .status {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 25px;
      text-align: center;
      font-weight: 500;
    }
    
    .status.loading {
      background: #fff3cd;
      color: #856404;
      border: 2px solid #ffeaa7;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 2px solid #c3e6cb;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #f5c6cb;
    }
    
    .wifi-info {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 25px;
      display: none;
    }
    
    .wifi-info.visible {
      display: block;
    }
    
    .wifi-info h3 {
      color: #495057;
      margin-bottom: 15px;
      font-size: 18px;
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #dee2e6;
    }
    
    .info-row:last-child {
      border-bottom: none;
    }
    
    .info-label {
      color: #6c757d;
      font-weight: 600;
    }
    
    .info-value {
      color: #212529;
      font-weight: 500;
    }
    
    .password-container {
      margin: 20px 0;
    }
    
    .password-container label {
      display: block;
      margin-bottom: 8px;
      color: #495057;
      font-weight: 600;
    }
    
    .password-input-wrapper {
      position: relative;
    }
    
    .wifi-input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ced4da;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.3s;
      background: rgba(255, 255, 255, 0.9);
    }
    
    .wifi-input:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    
    .wifi-btn {
      flex: 1;
      padding: 15px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      transition: all 0.3s;
      color: white;
    }
    
    .wifi-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    
    .btn-secondary {
      background: #6c757d;
    }
    
    .btn-secondary:hover:not(:disabled) {
      background: #5a6268;
      transform: translateY(-2px);
    }
    
    .btn-back {
      background: #28a745;
    }
    
    .btn-back:hover:not(:disabled) {
      background: #218838;
      transform: translateY(-2px);
    }
    
    #qr-container {
      margin-top: 30px;
      text-align: center;
      display: none;
    }
    
    #qr-container.visible {
      display: block;
    }
    
    #qr-container h3 {
      color: #495057;
      margin-bottom: 20px;
    }
    
    #qr-container img {
      max-width: 100%;
      border: 3px solid #667eea;
      border-radius: 15px;
      padding: 15px;
      background: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="background">
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="scanline"></div>
  </div>

  <div class="logo-container">
    <img src="./img/lightouch-logo-cropped.png" alt="Logo LighTouch" class="logo">
  </div>

  <div class="wifi-container">
    <h1 class="wifi-title">🔐 Générateur QR Code WiFi</h1>
    
    <div id="status" class="status loading">
      <div class="spinner"></div>
      Détection du WiFi en cours...
    </div>
    
    <div id="wifi-info" class="wifi-info">
      <h3>📶 Réseau détecté</h3>
      <div class="info-row">
        <span class="info-label">Nom du réseau (SSID)</span>
        <span class="info-value" id="ssid-display">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">Sécurité</span>
        <span class="info-value" id="security-display">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">Signal</span>
        <span class="info-value" id="signal-display">-</span>
      </div>
      
      <div class="password-container" id="password-section">
        <label for="password">Mot de passe WiFi</label>
        <div class="password-input-wrapper">
          <input type="password" id="password" class="wifi-input" placeholder="Entrez le mot de passe">
        </div>
      </div>
    </div>
    
    <div class="btn-group">
      <button onclick="window.location.href='index.html'" class="wifi-btn btn-back">🏠 Retour</button>
      <button id="refreshBtn" class="wifi-btn btn-secondary">🔄 Actualiser</button>
      <button id="generateBtn" class="wifi-btn btn-primary" disabled>✨ Générer QR Code</button>
    </div>
    
    <div id="qr-container">
      <h3>✅ Scannez ce QR Code</h3>
      <img id="qr-image" alt="WiFi QR Code">
    </div>
  </div>
  
  <script>
    let currentWiFi = null;
    
    const statusDiv = document.getElementById('status');
    const wifiInfoDiv = document.getElementById('wifi-info');
    const qrContainer = document.getElementById('qr-container');
    const generateBtn = document.getElementById('generateBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const passwordInput = document.getElementById('password');
    const passwordSection = document.getElementById('password-section');
    
    // Fonction pour afficher les infos WiFi
    function displayWiFiInfo(wifiInfo) {
      if (!wifiInfo.success) {
        statusDiv.className = 'status error';
        statusDiv.innerHTML = `❌ ${wifiInfo.error}`;
        wifiInfoDiv.classList.remove('visible');
        generateBtn.disabled = true;
        return;
      }
      
      currentWiFi = wifiInfo;
      
      // Afficher les infos
      document.getElementById('ssid-display').textContent = wifiInfo.ssid;
      document.getElementById('security-display').textContent = wifiInfo.security || 'WPA';
      document.getElementById('signal-display').textContent = wifiInfo.signal ? `${wifiInfo.signal}%` : 'N/A';
      
      // Gérer le mot de passe
      if (wifiInfo.password) {
        statusDiv.className = 'status success';
        statusDiv.textContent = '✅ WiFi détecté avec succès ! Mot de passe récupéré automatiquement.';
        passwordInput.value = wifiInfo.password;
        passwordSection.style.display = 'none';
      } else {
        statusDiv.className = 'status success';
        statusDiv.innerHTML = '✅ WiFi détecté ! <br><small>Veuillez entrer le mot de passe manuellement.</small>';
        passwordInput.value = '';
        passwordSection.style.display = 'block';
      }
      
      wifiInfoDiv.classList.add('visible');
      generateBtn.disabled = false;
    }
    
    // Initialiser la détection WiFi au chargement de la page
    window.addEventListener('DOMContentLoaded', async () => {
      const wifiInfo = await window.electronAPI.refreshWiFi();
      displayWiFiInfo(wifiInfo);
    });
    
    // Bouton actualiser
    refreshBtn.addEventListener('click', async () => {
      statusDiv.className = 'status loading';
      statusDiv.innerHTML = '<div class="spinner"></div>Actualisation...';
      generateBtn.disabled = true;
      qrContainer.classList.remove('visible');
      
      const wifiInfo = await window.electronAPI.refreshWiFi();
      displayWiFiInfo(wifiInfo);
    });
    
    // Bouton générer QR Code
    generateBtn.addEventListener('click', async () => {
      if (!currentWiFi) return;
      
      const password = passwordInput.value;
      
      if (!password) {
        statusDiv.className = 'status error';
        statusDiv.textContent = '⚠️ Veuillez entrer le mot de passe WiFi';
        return;
      }
      
      generateBtn.disabled = true;
      generateBtn.textContent = '⏳ Génération...';
      
      const result = await window.electronAPI.generateWiFiQR(
        currentWiFi.ssid,
        password,
        currentWiFi.security || 'WPA'
      );
      
      if (result.success) {
        document.getElementById('qr-image').src = result.qrCode;
        qrContainer.classList.add('visible');
        statusDiv.className = 'status success';
        statusDiv.textContent = '✅ QR Code généré avec succès !';
      } else {
        statusDiv.className = 'status error';
        statusDiv.textContent = `❌ Erreur : ${result.error}`;
      }
      
      generateBtn.disabled = false;
      generateBtn.textContent = '✨ Générer QR Code';
    });
    
    // Activer le bouton si on tape un mot de passe
    passwordInput.addEventListener('input', () => {
      if (currentWiFi && passwordInput.value) {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
