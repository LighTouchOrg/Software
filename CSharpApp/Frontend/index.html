<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>LighTouch®</title>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self';">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="landing.css">
    <!-- WebView2 adapter doit être chargé EN PREMIER -->
    <script src="webview-adapter.js"></script>
    <script defer src="renderer.js"></script>
    <script defer src="interactions/Actions.js"></script>
    <script defer src="interactions/Settings.js"></script>
    <script defer src="settings/multi-lang.js"></script>
    <script src="settings/User_Settings.js"></script>
  </head>
  <body>
    <div>
      <div class="logo-container">
        <img src="./img/LighTouchLogo.svg" alt="Logo LighTouch" class="logo" id="landing-logo">
      </div>
      <h1 id="brand-title">LighTouch</h1>
    </div>

    <div id="landing-navigation">
      <button id="calibrate-button" class="navigation-button" data-i18n="Calibration"></button>
      <button id="onboarding-button" class="navigation-button" data-i18n="Onboarding"></button>
      <div class="setting_row">
        <a class="navigation-button" href="settings/settings.html" data-i18n="Setting"></a>
        <a class="navigation-button" href="key_binding/key_binding.html" data-i18n="Keybind"></a>
        <a class="navigation-button" href="wifi-qr.html">WiFi QR</a>
      </div>
    </div>

    <div id="connection-status" class="device-info">
      <span id="device-status"></span>
    </div>

    <span id="enabled-status"></span>

    <a href="https://lightouchorg.github.io/software/docs.html" target="_blank" class="link bottom-right" data-i18n="Documentation"></a>
  </body>
</html>
