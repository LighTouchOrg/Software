<!DOCTYPE html>
<html lang="fr">
<head>
  <title>LighTouch®</title>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self';">
  <link rel="stylesheet" href="style.css">
  <!-- WebView2 adapter doit être chargé EN PREMIER -->
  <script src="webview-adapter.js"></script>
  <script defer src="renderer.js"></script>
  <script defer src="interactions/Actions.js"></script>
  <script defer src="interactions/Settings.js"></script>
  <script defer src="settings/multi-lang.js"></script>
  <script src="settings/User_Settings.js"></script>
</head>
<body>
  <div class="background">
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="scanline"></div>
  </div>

  <div class="logo-container">
    <img src="./img/lightouch-logo-cropped.png" alt="Logo LighTouch" class="logo">
  </div>

  <h1>LighTouch</h1>

  <div class="button-row-top">
    <button id="onboarding-button" class="button_setting" data-i18n="Onboarding"></button>
    <button id="calibrate-button" class="button_setting" data-i18n="Calibration"></button>
    <a class="button_setting" href="wifi-qr.html">WiFi QR</a>
  </div>

  <div class="button-row-bottom">
    <a class="button_setting" href="settings/settings.html" data-i18n="Setting"></a>
    <a class="button_setting" href="key_binding/key_binding.html" data-i18n="Keybind"></a>
  </div>

  <div id="connection-status" class="device-info">
    <span id="device-status"></span>
  </div>

  <span id="enabled-status"></span>
  
  <a href="https://lightouchorg.github.io/software/docs.html" target="_blank" class="link bottom-right" data-i18n="Documentation"></a>
</body>
</html>
