<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title data-i18n="title_setting"></title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self';" />
  <link rel="stylesheet" href="../style.css" />
  <script defer src="../renderer.js"></script>
  <script defer src="multi-lang.js"></script>
  <script defer src="settings.js"></script>
  <script src="User_Settings.js"></script>
</head>
<body>
  <div class="logo-container">
    <img src="../img/lightouch-logo.png" alt="Logo Lightouch" class="logo" />
  </div>

  <h1 data-i18n="Setting"></h1>

  <a class="button_setting" href="../index.html" data-i18n="Back"></a>

  <!-- Liseuse vocale -->
  <div class="setting-row">
    <span class="setting_name" data-i18n="Reader"></span>
    <label class="switch">
      <input data-i18n="Reader" type="checkbox" id="reader-toggle" />
      <span class="slider round"></span>
    </label>
  </div>

  <!-- Taille de texte -->
<div class="setting-row">
    <label for="text-size-slider" class="setting_name" data-i18n="SizeText"></label>
    <div style="flex-grow:1; margin-left: 15px; display: flex; flex-direction: column; align-items: center;">
      <input
        type="range"
        min="1"
        max="3"
        step="1"
        value="2"
        id="text-size-slider"
        style="width: 100%;"
        data-i18n="SizeText"
      />
      <div class="slider-labels" style="display: flex; justify-content: space-between; width: 100%; margin-top: 4px; margin-left: 25px;">
        <span style="font-size: 0.7rem;">T</span>
        <span style="font-size: 1.1rem;">T</span>
        <span style="font-size: 1.6rem;">T</span>
      </div>
    </div>
  </div>

  <!-- Thème clair / sombre -->
  <div class="setting-row">
    <span class="setting_name" data-i18n="Theme"></span>
    <label class="switch">
      <input data-i18n="Theme" type="checkbox" id="theme-toggle"/>
      <span class="slider round"></span>
    </label>
  </div>

  <!-- Toggle Mode - Naviguation and Presentation -->

  <div class="setting-row">
    <span class="setting_name" data-i18n="PresMode"></span>
    <label class="switch">
      <input data-i18n="PresMode" type="checkbox" id="presentation-toggle"/>
      <span class="slider round"></span>
    </label>
  </div>

  <div class="setting-row">
    <span class="setting_name" data-i18n="NavMode"></span>
    <label class="switch">
      <input data-i18n="NavMode" type="checkbox" id="nav-toggle"/>
      <span class="slider round"></span>
    </label>
  </div>

  <!-- Select Langage - french or english -->

  <div class="setting-row">
    <span class="setting_name" data-i18n="Langage"></span>

    <select id="lang-selector" name="Langage">
      <option data-i18n="fr" class="lang" value="fr"></option>
      <option data-i18n="en" class="lang" value="en"></option>
    </select>
  </div>

</body>
</html>
