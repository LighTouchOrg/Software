<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Lightouch – Tutoriel</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self';" />
  <link rel="stylesheet" href="style.css" />
  <script defer src="settings/multi-lang.js"></script>
  <script defer src="interactions/onboarding.js"></script>
  <script src="settings/User_Settings.js"></script>
</head>
<body>
  <div class="background">
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="scanline"></div>
  </div>

  <div class="logo-container">
    <img src="./img/lightouch-logo.png" alt="Logo Lightouch" class="logo" />
  </div>

  <h1 data-i18n="Onboarding">Tutoriel Lightouch</h1>
  <div id="tutorial-container">
    <div id="step-text" class="device-info">Préparation du didacticiel…</div>
    <canvas id="target-canvas" width="600" height="400" class="hidden"></canvas>
    <button id="finish-btn" class="hidden" data-i18n="onboarding_finish"></button>
  </div>
</body>
</html>
