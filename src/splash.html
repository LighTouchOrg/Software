<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LighTouch</title>
    <style>
      :root { --bg: #1d1136; --fg: #ffffff; --muted: #8b8b8b; }
      html, body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        overflow: hidden;
      }
      .wrap {
        height: 100%;
        display: grid;
        place-items: center;
        gap: 12px;
        text-align: center;
        padding: 8px;
        padding-block: 32px; /* adds space top & bottom */
        box-sizing: border-box;
      }
      .logo {
        width: 96px; height: 96px; border-radius: 10%; object-fit: contain;
        filter: drop-shadow(0 2px 8px rgba(0,0,0,.35));
      }
      .title { font-size: 18px; letter-spacing: .3px; }
      .sub { font-size: 12px; color: var(--muted); }
      .spinner {
        width: 20px; height: 20px; border-radius: 50%;
        border: 2px solid #2a2a2a; border-top-color: #6cc644;
        animation: spin 1s linear infinite; margin: 6px auto 0;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="img/lightouch-logo-cropped.png" alt="LighTouch" />
      <div class="title">LighTouch</div>
      <div class="sub">Starting up…</div>
      <div class="spinner"></div>
    </div>
  </body>
</html>
